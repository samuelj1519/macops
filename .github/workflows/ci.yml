name: Rust checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  RUST_TEST_THREADS: "1"

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fetch --locked
      - name: Format and lint
        run: bash tools/check.sh quick
      - name: All target and documentation tests
        run: bash tools/check.sh tests

  quality:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
        with:
          toolchain: 1.100.0
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2,cargo-llvm-cov@0.9.1,typos@1.52.1,taplo@0.10.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Prepare dependencies and security data
        run: |
          cargo fetch --locked
          cargo deny fetch db
      - name: Source, dependencies and coverage
        run: bash tools/check.sh quality
      - name: Coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-coverage
          path: target/coverage/workspace.json
          if-no-files-found: error
