name: Tagged release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
        with:
          toolchain: 1.100.0
      - name: Confirm the tagged commit passed main CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 -B tools/release.py require-ci "$(git rev-parse HEAD)" --repo "$GITHUB_REPOSITORY"
      - name: Build and package the tagged commit
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          git merge-base --is-ancestor HEAD origin/main
          cargo fetch --locked
          cargo build --release --locked --offline
          bash tools/package_release.sh "$GITHUB_REF_NAME" target/release/macops "$RUNNER_TEMP/macops-release"
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "macops $GITHUB_REF_NAME" --notes-from-tag "$RUNNER_TEMP/macops-release/macops-$GITHUB_REF_NAME-darwin-arm64.tar.gz" "$RUNNER_TEMP/macops-release/SHA256SUMS"
