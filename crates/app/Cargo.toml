[package]
name = "macops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "本机软件、Agent 资产与目录的统一维护入口"

[lints]
workspace = true

[dependencies]
base64 = "=0.23.1"
clap = { version = "=4.6.7", features = ["derive"] }
fs2 = "=0.4.3"
getrandom = "=0.4.3"
nix = { version = "=0.29.0", features = ["process", "signal", "term", "user"] }
plist = "=1.10.3"
rustix = { version = "=1.1.6", features = ["fs", "process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde-saphyr = { version = "=2.2.0", default-features = false, features = ["deserialize"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
toml_edit = { version = "=0.25.17", default-features = false, features = ["display", "parse"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["events"] }

[dependencies.ratatui]
version = "=0.30.2"
default-features = false
features = ["crossterm", "unstable-rendered-line-info"]

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", default-features = false }
